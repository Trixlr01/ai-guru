<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veresiye Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --cover: #1F3A2E;
    --cover-dark: #14261E;
    --paper: #FBF7EE;
    --paper-line: #E3DAC4;
    --ink: #2A2420;
    --ink-soft: #6B6155;
    --gold: #A87C1E;
    --gold-soft: #DEC97A;
    --debt: #A6392E;
    --debt-bg: #F4E4DF;
    --paid: #2F6B4F;
    --paid-bg: #E3EFE6;
    --surface: #FFFFFF;
    --shadow-line: rgba(42,36,32,0.14);

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1B1712;
      --paper-line: #34302A;
      --ink: #EDE6D8;
      --ink-soft: #A79E8E;
      --surface: #241F19;
      --debt: #E2887A;
      --debt-bg: #3A241F;
      --paid: #83C0A0;
      --paid-bg: #1E3229;
      --shadow-line: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1712;
    --paper-line: #34302A;
    --ink: #EDE6D8;
    --ink-soft: #A79E8E;
    --surface: #241F19;
    --debt: #E2887A;
    --debt-bg: #3A241F;
    --paid: #83C0A0;
    --paid-bg: #1E3229;
    --shadow-line: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- Cover header ---------- */
  .cover {
    background: linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    color: var(--gold-soft);
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 22px;
    position: relative;
    border-bottom: 3px solid var(--gold);
  }
  .cover-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .cover h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    color: #F6EFDD;
    letter-spacing: 0.01em;
  }
  .cover .tagline {
    margin: 2px 0 0;
    font-size: 0.8rem;
    color: var(--gold-soft);
    opacity: 0.85;
  }
  .menu-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(222,201,122,0.35);
    color: var(--gold-soft);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.78rem;
    font-family: var(--font-body);
    cursor: pointer;
  }
  .cover-total {
    margin-top: 20px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .cover-total .amount {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 2rem;
    font-weight: 600;
    color: #F6EFDD;
  }
  .cover-total .label {
    font-size: 0.82rem;
    color: var(--gold-soft);
    opacity: 0.8;
  }
  .cover-sub {
    margin-top: 4px;
    font-size: 0.78rem;
    color: var(--gold-soft);
    opacity: 0.75;
  }

  /* ---------- Search bar ---------- */
  .searchbar {
    padding: 14px 16px 6px;
    display: flex;
    gap: 8px;
  }
  .searchbar input {
    flex: 1;
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 10px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
  }
  .searchbar input:focus, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  /* ---------- Ledger list ---------- */
  .ledger-list {
    flex: 1;
    padding: 4px 16px 120px;
    overflow-x: auto;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--paper-line);
    cursor: pointer;
    background: none;
    border-left: none; border-right: none; border-top: none;
    width: 100%;
    text-align: left;
    font-family: var(--font-body);
    color: var(--ink);
  }
  .row:last-child { border-bottom: 1px solid var(--paper-line); }
  .row .name-block { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .row .name { font-size: 1rem; font-weight: 500; }
  .row .meta { font-size: 0.76rem; color: var(--ink-soft); }
  .row .bal { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1rem; font-weight: 600; white-space: nowrap; }
  .row .bal.debt { color: var(--debt); }
  .row .bal.paid { color: var(--paid); }
  .row .bal.zero { color: var(--ink-soft); }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-soft);
  }
  .empty-state .glyph { font-size: 2.2rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.92rem; line-height: 1.5; margin: 0; }

  /* ---------- Floating buttons ---------- */
  .fab-stack {
    position: fixed;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 30;
  }
  .app { position: relative; }
  .fab {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px var(--shadow-line);
  }
  .fab-add { background: var(--cover); color: var(--gold-soft); }
  .fab-mic { background: var(--gold); color: var(--cover-dark); }
  .fab-mic.listening { animation: pulse 1.1s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(168,124,30,0.55); }
    70% { box-shadow: 0 0 0 14px rgba(168,124,30,0); }
    100% { box-shadow: 0 0 0 0 rgba(168,124,30,0); }
  }

  /* ---------- Sheets / modals ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(20,17,13,0.45);
    z-index: 40;
    display: none;
  }
  .scrim.open { display: block; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
    border-top: 1px solid var(--paper-line);
    border-radius: 16px 16px 0 0;
    z-index: 41;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.22s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--paper-line);
    border-radius: 2px;
    margin: 10px auto 4px;
  }
  .sheet-head {
    padding: 8px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--paper-line);
  }
  .sheet-head h2 {
    font-family: var(--font-display);
    font-size: 1.2rem;
    margin: 0;
  }
  .sheet-close {
    background: none; border: none; font-size: 1.2rem;
    color: var(--ink-soft); cursor: pointer; padding: 4px 6px;
  }
  .sheet-body { padding: 16px 20px 24px; overflow-y: auto; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.98rem;
    padding: 10px 11px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  .field .amount-input { font-family: var(--font-mono); }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 0.9rem;
    cursor: pointer;
  }
  .type-toggle button.active.borc { background: var(--debt-bg); color: var(--debt); border-color: var(--debt); }
  .type-toggle button.active.odeme { background: var(--paid-bg); color: var(--paid); border-color: var(--paid); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: none;
    font-family: var(--font-body);
    font-size: 0.96rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary { background: var(--cover); color: var(--gold-soft); }
  .btn-danger { background: transparent; color: var(--debt); border: 1px solid var(--debt); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--paper-line); }
  .btn + .btn { margin-top: 10px; }

  .balance-hero {
    text-align: center;
    padding: 6px 0 18px;
  }
  .balance-hero .amount {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 2.1rem;
    font-weight: 600;
  }
  .balance-hero .amount.debt { color: var(--debt); }
  .balance-hero .amount.paid { color: var(--paid); }
  .balance-hero .amount.zero { color: var(--ink-soft); }
  .balance-hero .sub { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }

  .tx-list { margin: 6px 0 18px; }
  .tx-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--paper-line);
    gap: 10px;
  }
  .tx-row .tx-main { min-width: 0; }
  .tx-row .tx-note { font-size: 0.9rem; }
  .tx-row .tx-date { font-size: 0.74rem; color: var(--ink-soft); }
  .tx-row .tx-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
  .tx-row .tx-amount.borc { color: var(--debt); }
  .tx-row .tx-amount.odeme { color: var(--paid); }
  .tx-del {
    background: none; border: none; color: var(--ink-soft);
    font-size: 0.76rem; cursor: pointer; text-decoration: underline;
    padding: 4px;
  }
  .section-label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 4px 0 8px;
  }

  /* ---------- Voice confirm sheet ---------- */
  .voice-transcript {
    background: var(--paper);
    border: 1px dashed var(--paper-line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    transform: translateX(-50%) translateY(20px);
    background: var(--cover-dark);
    color: #F6EFDD;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 0.86rem;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-width: 85%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- Confirm dialog ---------- */
  .confirm-box {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--surface);
    border-radius: 12px;
    padding: 20px;
    width: 84%;
    max-width: 340px;
    z-index: 61;
    display: none;
  }
  .confirm-box.open { display: block; }
  .confirm-box p { font-size: 0.92rem; margin: 0 0 16px; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions .btn { margin-top: 0; }

  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="app">

  <header class="cover">
    <div class="cover-top">
      <div>
        <h1>Veresiye Defteri</h1>
        <p class="tagline">Kim ne kadar borçlu, tek yerde</p>
      </div>
      <button class="menu-btn" id="menuBtn" type="button">Yedekle ⋯</button>
    </div>
    <div class="cover-total">
      <span class="amount" id="totalAmount">0,00 ₺</span>
      <span class="label">toplam alacak</span>
    </div>
    <p class="cover-sub" id="debtorCount">0 borçlu kayıtlı</p>
  </header>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Borçlu ara…" autocomplete="off">
  </div>

  <main class="ledger-list" id="ledgerList"></main>

  <div class="fab-stack">
    <button class="fab fab-mic" id="micBtn" type="button" title="Sesli kayıt" aria-label="Sesli kayıt">🎤</button>
    <button class="fab fab-add" id="addBtn" type="button" title="Yeni borçlu ekle" aria-label="Yeni borçlu ekle">＋</button>
  </div>

  <input type="file" id="importFile" accept="application/json">
</div>

<!-- Scrim -->
<div class="scrim" id="scrim"></div>

<!-- New debtor sheet -->
<div class="sheet" id="newDebtorSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Yeni borçlu</h2>
    <button class="sheet-close" data-close>✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label for="newName">İsim</label>
      <input type="text" id="newName" placeholder="Ör. Ahmet Yılmaz">
    </div>
    <div class="field">
      <label for="newPhone">Telefon (opsiyonel)</label>
      <input type="tel" id="newPhone" placeholder="05xx xxx xx xx">
    </div>
    <div class="field">
      <label for="newInitial">Başlangıç borcu (opsiyonel)</label>
      <input type="number" inputmode="decimal" class="amount-input" id="newInitial" placeholder="0,00">
    </div>
    <button class="btn btn-primary" id="saveNewDebtor">Kaydet</button>
  </div>
</div>

<!-- Debtor detail sheet -->
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 id="detailName">İsim</h2>
    <button class="sheet-close" data-close>✕</button>
  </div>
  <div class="sheet-body">
    <div class="balance-hero">
      <div class="amount" id="detailBalance">0,00 ₺</div>
      <div class="sub" id="detailPhone"></div>
    </div>

    <div class="section-label">Yeni hareket</div>
    <div class="field">
      <div class="type-toggle">
        <button type="button" class="active borc" data-type="borc" id="typeBorc">Borç verildi</button>
        <button type="button" class="odeme" data-type="odeme" id="typeOdeme">Ödeme alındı</button>
      </div>
    </div>
    <div class="field">
      <label for="txAmount">Tutar</label>
      <input type="number" inputmode="decimal" class="amount-input" id="txAmount" placeholder="0,00">
    </div>
    <div class="field">
      <label for="txNote">Not (opsiyonel)</label>
      <input type="text" id="txNote" placeholder="Ör. ekmek, süt">
    </div>
    <button class="btn btn-primary" id="saveTx">Ekle</button>

    <div class="section-label" style="margin-top:22px;">Hareketler</div>
    <div class="tx-list" id="txList"></div>

    <button class="btn btn-danger" id="deleteDebtor">Bu borçluyu sil</button>
  </div>
</div>

<!-- Voice confirm sheet -->
<div class="sheet" id="voiceSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Sesli kayıt</h2>
    <button class="sheet-close" data-close>✕</button>
  </div>
  <div class="sheet-body">
    <div class="voice-transcript" id="voiceTranscript"></div>
    <div class="field">
      <label for="voiceName">İsim</label>
      <input type="text" id="voiceName">
    </div>
    <div class="field">
      <div class="type-toggle">
        <button type="button" class="active borc" data-vtype="borc" id="vTypeBorc">Borç verildi</button>
        <button type="button" class="odeme" data-vtype="odeme" id="vTypeOdeme">Ödeme alındı</button>
      </div>
    </div>
    <div class="field">
      <label for="voiceAmount">Tutar</label>
      <input type="number" inputmode="decimal" class="amount-input" id="voiceAmount">
    </div>
    <button class="btn btn-primary" id="voiceSave">Kaydet</button>
    <button class="btn btn-ghost" id="voiceCancel">Vazgeç</button>
  </div>
</div>

<div class="confirm-box" id="confirmBox">
  <p id="confirmText"></p>
  <div class="confirm-actions">
    <button class="btn btn-ghost" id="confirmNo">Vazgeç</button>
    <button class="btn btn-danger" id="confirmYes">Sil</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "veresiye_defteri_v1";
  var state = { debtors: [], transactions: [] };
  var activeDebtorId = null;
  var voiceType = "borc";
  var txType = "borc";
  var pendingDelete = null;
  var recognition = null;
  var listening = false;

  // ---------- Persistence ----------
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.debtors) && Array.isArray(parsed.transactions)) {
          state = parsed;
        }
      }
    } catch (e) { /* start fresh if corrupt */ }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      showToast("Kaydedilemedi: depolama dolu olabilir");
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---------- Helpers ----------
  function money(n) {
    return n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
  }
  function normalize(s) {
    return (s || "").toLocaleLowerCase("tr-TR").trim();
  }
  function formatDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" });
  }
  function balanceOf(debtorId) {
    var bal = 0;
    for (var i = 0; i < state.transactions.length; i++) {
      var t = state.transactions[i];
      if (t.debtorId !== debtorId) continue;
      bal += t.type === "borc" ? t.amount : -t.amount;
    }
    return bal;
  }
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  // ---------- Rendering ----------
  function renderTotals() {
    var total = 0;
    for (var i = 0; i < state.debtors.length; i++) total += Math.max(0, balanceOf(state.debtors[i].id));
    document.getElementById("totalAmount").textContent = money(total);
    document.getElementById("debtorCount").textContent =
      state.debtors.length + (state.debtors.length === 1 ? " borçlu kayıtlı" : " borçlu kayıtlı");
  }

  function renderList() {
    var q = normalize(document.getElementById("searchInput").value);
    var list = document.getElementById("ledgerList");
    var items = state.debtors.slice();

    items.sort(function (a, b) { return balanceOf(b.id) - balanceOf(a.id); });

    if (q) {
      items = items.filter(function (d) { return normalize(d.name).indexOf(q) !== -1; });
    }

    if (items.length === 0) {
      list.innerHTML =
        '<div class="empty-state"><div class="glyph">📒</div>' +
        "<p>" + (state.debtors.length === 0
          ? "Henüz borçlu eklenmedi. Sağ alttaki artı düğmesiyle veya mikrofonla ekleyebilirsin."
          : "Aramanla eşleşen borçlu yok.") +
        "</p></div>";
      return;
    }

    var html = "";
    for (var i = 0; i < items.length; i++) {
      var d = items[i];
      var bal = balanceOf(d.id);
      var cls = bal > 0 ? "debt" : (bal < 0 ? "paid" : "zero");
      var txCount = state.transactions.filter(function (t) { return t.debtorId === d.id; }).length;
      html +=
        '<button class="row" data-id="' + d.id + '">' +
        '<span class="name-block"><span class="name">' + escapeHtml(d.name) + "</span>" +
        '<span class="meta">' + txCount + (txCount === 1 ? " hareket" : " hareket") + "</span></span>" +
        '<span class="bal ' + cls + '">' + money(bal) + "</span>" +
        "</button>";
    }
    list.innerHTML = html;

    var rows = list.querySelectorAll(".row");
    rows.forEach(function (row) {
      row.addEventListener("click", function () { openDetail(row.getAttribute("data-id")); });
    });
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function renderAll() {
    renderTotals();
    renderList();
  }

  // ---------- Sheets ----------
  function openSheet(id) {
    document.getElementById("scrim").classList.add("open");
    document.getElementById(id).classList.add("open");
  }
  function closeSheets() {
    document.getElementById("scrim").classList.remove("open");
    document.querySelectorAll(".sheet").forEach(function (s) { s.classList.remove("open"); });
    activeDebtorId = null;
  }
  document.getElementById("scrim").addEventListener("click", closeSheets);
  document.querySelectorAll("[data-close]").forEach(function (b) {
    b.addEventListener("click", closeSheets);
  });

  // ---------- New debtor ----------
  document.getElementById("addBtn").addEventListener("click", function () {
    document.getElementById("newName").value = "";
    document.getElementById("newPhone").value = "";
    document.getElementById("newInitial").value = "";
    openSheet("newDebtorSheet");
    setTimeout(function () { document.getElementById("newName").focus(); }, 150);
  });

  document.getElementById("saveNewDebtor").addEventListener("click", function () {
    var name = document.getElementById("newName").value.trim();
    if (!name) { showToast("İsim gerekli"); return; }
    var phone = document.getElementById("newPhone").value.trim();
    var initial = parseFloat((document.getElementById("newInitial").value || "0").replace(",", "."));
    var d = { id: uid(), name: name, phone: phone, createdAt: new Date().toISOString() };
    state.debtors.push(d);
    if (initial && initial > 0) {
      state.transactions.push({
        id: uid(), debtorId: d.id, type: "borc", amount: initial,
        note: "Başlangıç borcu", date: new Date().toISOString()
      });
    }
    save();
    closeSheets();
    renderAll();
    showToast(name + " eklendi");
  });

  // ---------- Detail sheet ----------
  function openDetail(id) {
    var d = state.debtors.find(function (x) { return x.id === id; });
    if (!d) return;
    activeDebtorId = id;
    document.getElementById("detailName").textContent = d.name;
    document.getElementById("detailPhone").textContent = d.phone || "";
    document.getElementById("txAmount").value = "";
    document.getElementById("txNote").value = "";
    setTxType("borc");
    renderDetail();
    openSheet("detailSheet");
  }

  function renderDetail() {
    if (!activeDebtorId) return;
    var bal = balanceOf(activeDebtorId);
    var cls = bal > 0 ? "debt" : (bal < 0 ? "paid" : "zero");
    var balEl = document.getElementById("detailBalance");
    balEl.textContent = money(bal);
    balEl.className = "amount " + cls;

    var txs = state.transactions
      .filter(function (t) { return t.debtorId === activeDebtorId; })
      .sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

    var listEl = document.getElementById("txList");
    if (txs.length === 0) {
      listEl.innerHTML = '<p class="section-label">Henüz hareket yok.</p>';
    } else {
      var html = "";
      for (var i = 0; i < txs.length; i++) {
        var t = txs[i];
        html +=
          '<div class="tx-row"><div class="tx-main">' +
          '<div class="tx-note">' + escapeHtml(t.note || (t.type === "borc" ? "Borç" : "Ödeme")) + "</div>" +
          '<div class="tx-date">' + formatDate(t.date) + "</div></div>" +
          '<div style="text-align:right;"><div class="tx-amount ' + t.type + '">' +
          (t.type === "borc" ? "+" : "−") + money(t.amount) + "</div>" +
          '<button class="tx-del" data-tx="' + t.id + '">sil</button></div></div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll(".tx-del").forEach(function (btn) {
        btn.addEventListener("click", function () {
          askConfirm("Bu hareketi silmek istiyor musun?", function () {
            state.transactions = state.transactions.filter(function (t) { return t.id !== btn.getAttribute("data-tx"); });
            save();
            renderDetail();
            renderAll();
          });
        });
      });
    }
    renderAll();
  }

  function setTxType(type) {
    txType = type;
    document.getElementById("typeBorc").classList.toggle("active", type === "borc");
    document.getElementById("typeOdeme").classList.toggle("active", type === "odeme");
  }
  document.getElementById("typeBorc").addEventListener("click", function () { setTxType("borc"); });
  document.getElementById("typeOdeme").addEventListener("click", function () { setTxType("odeme"); });

  document.getElementById("saveTx").addEventListener("click", function () {
    if (!activeDebtorId) return;
    var amount = parseFloat((document.getElementById("txAmount").value || "").replace(",", "."));
    if (!amount || amount <= 0) { showToast("Geçerli bir tutar gir"); return; }
    var note = document.getElementById("txNote").value.trim();
    state.transactions.push({
      id: uid(), debtorId: activeDebtorId, type: txType, amount: amount,
      note: note, date: new Date().toISOString()
    });
    save();
    document.getElementById("txAmount").value = "";
    document.getElementById("txNote").value = "";
    renderDetail();
    showToast(txType === "borc" ? "Borç eklendi" : "Ödeme kaydedildi");
  });

  document.getElementById("deleteDebtor").addEventListener("click", function () {
    if (!activeDebtorId) return;
    var d = state.debtors.find(function (x) { return x.id === activeDebtorId; });
    askConfirm((d ? d.name : "Bu kişi") + " ve tüm hareketleri silinsin mi?", function () {
      var id = activeDebtorId;
      state.debtors = state.debtors.filter(function (x) { return x.id !== id; });
      state.transactions = state.transactions.filter(function (t) { return t.debtorId !== id; });
      save();
      closeSheets();
      renderAll();
      showToast("Borçlu silindi");
    });
  });

  // ---------- Confirm dialog ----------
  function askConfirm(text, onYes) {
    document.getElementById("confirmText").textContent = text;
    document.getElementById("confirmBox").classList.add("open");
    pendingDelete = onYes;
  }
  document.getElementById("confirmYes").addEventListener("click", function () {
    document.getElementById("confirmBox").classList.remove("open");
    if (pendingDelete) pendingDelete();
    pendingDelete = null;
  });
  document.getElementById("confirmNo").addEventListener("click", function () {
    document.getElementById("confirmBox").classList.remove("open");
    pendingDelete = null;
  });

  // ---------- Search ----------
  document.getElementById("searchInput").addEventListener("input", renderList);

  // ---------- Backup / restore ----------
  document.getElementById("menuBtn").addEventListener("click", function () {
    askBackupMenu();
  });
  function askBackupMenu() {
    var choice = window.confirm(
      "Tamam: verileri JSON olarak indir\nİptal: bir yedekten geri yükle"
    );
    if (choice) {
      exportData();
    } else {
      document.getElementById("importFile").click();
    }
  }
  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "veresiye-yedek-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("Yedek indirildi");
  }
  document.getElementById("importFile").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (parsed && Array.isArray(parsed.debtors) && Array.isArray(parsed.transactions)) {
          state = parsed;
          save();
          renderAll();
          showToast("Yedek yüklendi");
        } else {
          showToast("Geçersiz yedek dosyası");
        }
      } catch (err) {
        showToast("Dosya okunamadı");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---------- Voice ----------
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "tr-TR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function (event) {
      var transcript = event.results[0][0].transcript;
      handleVoiceTranscript(transcript);
    };
    recognition.onerror = function () {
      setListening(false);
      showToast("Ses anlaşılamadı, tekrar dene");
    };
    recognition.onend = function () { setListening(false); };
  } else {
    document.getElementById("micBtn").addEventListener("click", function () {
      showToast("Bu tarayıcı sesli komutu desteklemiyor");
    });
  }

  function setListening(v) {
    listening = v;
    document.getElementById("micBtn").classList.toggle("listening", v);
  }

  if (recognition) {
    document.getElementById("micBtn").addEventListener("click", function () {
      if (listening) { recognition.stop(); return; }
      try {
        recognition.start();
        setListening(true);
        showToast("Dinliyorum…");
      } catch (e) {
        setListening(false);
      }
    });
  }

  function handleVoiceTranscript(transcript) {
    var lower = transcript.toLocaleLowerCase("tr-TR");

    var amountMatch = lower.match(/(\d+(?:[.,]\d{1,2})?)/);
    var amount = amountMatch ? parseFloat(amountMatch[1].replace(",", ".")) : null;

    var type = /öde/.test(lower) ? "odeme" : "borc";

    var firstWord = transcript.trim().split(/\s+/)[0] || "";
    var name = firstWord.split("'")[0].split("’")[0];
    name = name.replace(/[^\wçğıöşüÇĞİÖŞÜ]/g, "");
    if (name) name = name.charAt(0).toLocaleUpperCase("tr-TR") + name.slice(1);

    // try to match an existing debtor by substring either direction
    var matched = state.debtors.find(function (d) {
      var dn = normalize(d.name);
      return dn.indexOf(normalize(name)) !== -1 || normalize(name).indexOf(dn) !== -1;
    });
    if (matched) name = matched.name;

    document.getElementById("voiceTranscript").textContent = '"' + transcript + '"';
    document.getElementById("voiceName").value = name;
    document.getElementById("voiceAmount").value = amount || "";
    setVoiceType(type);
    openSheet("voiceSheet");
  }

  function setVoiceType(type) {
    voiceType = type;
    document.getElementById("vTypeBorc").classList.toggle("active", type === "borc");
    document.getElementById("vTypeOdeme").classList.toggle("active", type === "odeme");
  }
  document.getElementById("vTypeBorc").addEventListener("click", function () { setVoiceType("borc"); });
  document.getElementById("vTypeOdeme").addEventListener("click", function () { setVoiceType("odeme"); });

  document.getElementById("voiceCancel").addEventListener("click", closeSheets);

  document.getElementById("voiceSave").addEventListener("click", function () {
    var name = document.getElementById("voiceName").value.trim();
    var amount = parseFloat((document.getElementById("voiceAmount").value || "").replace(",", "."));
    if (!name) { showToast("İsim gerekli"); return; }
    if (!amount || amount <= 0) { showToast("Geçerli bir tutar gir"); return; }

    var debtor = state.debtors.find(function (d) { return normalize(d.name) === normalize(name); });
    if (!debtor) {
      debtor = { id: uid(), name: name, phone: "", createdAt: new Date().toISOString() };
      state.debtors.push(debtor);
    }
    state.transactions.push({
      id: uid(), debtorId: debtor.id, type: voiceType, amount: amount,
      note: voiceType === "borc" ? "Sesli kayıt" : "Sesli kayıt (ödeme)",
      date: new Date().toISOString()
    });
    save();
    closeSheets();
    renderAll();
    showToast(name + " için kaydedildi");
  });

  // ---------- Init ----------
  load();
  renderAll();
})();
</script>
</body>
</html>
